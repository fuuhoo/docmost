services:
  docmost:
    # 自建镜像示例，按实际 tag 修改
    image: fubin/docmost:v260916-sw

    depends_on:
      - db
      - redis
    environment:
      APP_URL: "http://172.17.4.75:3000"
      APP_SECRET: "z4K9mP2vL7wN5rX8tJ1cQ6hG0yB3eS9f"
      DATABASE_URL: "postgresql://docmost:postsw123@db:5432/docmost"
      REDIS_URL: "redis://redis:6379"

      # 邮件（邀请 / 注册 / 找回密码）
      MAIL_DRIVER: smtp
      MAIL_FROM_ADDRESS: hongbinfu@qq.com
      MAIL_FROM_NAME: Docmost
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: 587
      SMTP_USERNAME: hongbinfu@qq.com
      SMTP_PASSWORD: ahdtuvmwlwanggaj
      SMTP_SECURE: "false"
      SMTP_IGNORETLS: "false"

      # 自主注册开关与允许邮箱域名已改为「设置 → Security & SSO」里配置
      # 不再依赖环境变量 ENABLE_REGISTRATION / EMAIL_ALLOWED_DOMAINS
      # 如需首次启动时用环境变量兜底，可临时加回，但界面关闭后 env 仍会强制开启

    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./docmost:/app/data/storage

  db:
    image: fubin/postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: postsw123
    restart: unless-stopped
    volumes:
      # 官方 postgres 镜像数据目录是 /var/lib/postgresql/data
      # 若你的镜像自定义了数据路径，保持原路径即可
      - ./db_data:/var/lib/postgresql/data

  redis:
    image: fubin/redis:8.2.3
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
